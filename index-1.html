<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Январь — Мороз Иванович</title>
<style>
:root{--b:#1559b7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eaf6ff;color:#17345b}.wrap{max-width:780px;margin:auto;min-height:100vh;background:#fff}
.hero{position:relative}.hero img{display:block;width:100%}.hotspot{position:absolute;display:block;border-radius:24px;text-indent:-9999px;overflow:hidden}.read{left:4.5%;top:45.8%;width:44.5%;height:15.2%}.listen{left:50.7%;top:45.8%;width:44.5%;height:15.2%}.watch{left:4.5%;top:62.3%;width:44.5%;height:15.2%}.play{left:50.7%;top:62.3%;width:44.5%;height:15.2%}
.section{display:none;min-height:100vh;padding:0 14px 34px;background:linear-gradient(#eaf7ff,#fff)}.section.active{display:block}.topbar{position:sticky;top:0;z-index:20;background:#fffffff5;padding:10px 4px;border-bottom:1px solid #d9e7f7;display:flex;gap:10px;align-items:center}.topbar button{border:0;border-radius:16px;padding:12px 15px;background:var(--b);color:white;font-weight:800}.topbar b{font-size:20px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 28px #00468c1f;margin:12px 0}h1,h2{color:#114c9c}.bigbtn{display:inline-block;border-radius:18px;padding:16px 20px;margin-top:8px;font-size:19px;font-weight:700;text-decoration:none;background:var(--b);color:#fff}
.book-head{text-align:center;padding:18px 6px 8px}.month{display:inline-block;background:linear-gradient(#fff,#d8f2ff);border:3px solid #7fc9f4;border-radius:24px;padding:8px 28px;color:#164fa1;font-size:28px;font-weight:900;box-shadow:0 5px 15px #b9dff5}.book-head h1{font-family:Georgia,serif;font-size:35px;margin:12px 0 2px}.book-head p{margin:0;color:#526f92;font-weight:700}
.book{position:relative;background:linear-gradient(90deg,#fffaf0,#fff 49%,#ead8b7 50%,#fff 51%,#fffaf0);border:5px solid #a97438;border-radius:28px;padding:18px 16px;box-shadow:0 12px 30px #1e4b783f,inset 0 0 25px #ead8b7;overflow:hidden}.badge{width:max-content;margin:auto;padding:7px 18px;border:2px solid #83cff5;border-radius:18px;background:#effaff;color:var(--b);font-weight:800}.ptitle{text-align:center;font-family:Georgia,serif;font-size:30px;margin:9px 0 14px}
.scene{height:330px;border-radius:22px;border:4px solid #c5eaff;background:url('moroz-book-scenes.jpg') no-repeat;background-size:100% 800%;box-shadow:inset 0 0 0 4px #fff,0 5px 15px #003c781f;margin-bottom:16px}.booktext{font-family:Georgia,serif;font-size:22px;line-height:1.55;color:#243d5c}.booktext p{margin:0 0 14px}.moral{background:#fff2c9;border:2px solid #e3bc5d;border-radius:16px;padding:12px;text-align:center;font-family:Georgia,serif;font-weight:700;color:#795019}.counter{text-align:center;margin:12px auto 0;background:#e8f7ff;border:2px solid #8dd2f7;border-radius:20px;width:max-content;padding:6px 18px;font-weight:900;color:#164f9e}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.nav button,.contentsBtn{border:0;border-radius:18px;padding:15px 10px;font-weight:800;font-size:17px}.nav button{background:var(--b);color:white}.nav button:disabled{background:#c9d9e8;color:#6e8398}.contentsBtn{width:100%;background:#e7f4ff;color:var(--b);border:2px solid #b8ddf7}.contents{display:none;background:white;border-radius:22px;padding:14px;box-shadow:0 7px 20px #00468c1f;margin:10px 0}.contents.open{display:block}.contents button{width:100%;border:0;background:#f0f8ff;border-radius:14px;padding:12px;margin:5px 0;text-align:left;color:#174b8c;font-weight:700}.contents button.current{background:#ffe2f0;color:#a31f61}
.quiz button{display:block;width:100%;text-align:left;border:2px solid #d8e8ff;background:white;border-radius:16px;padding:14px;margin:10px 0;font-size:18px}.quiz button.correct{background:#ddf7df}.quiz button.wrong{background:#ffe2e2}.status{font-size:20px;font-weight:700}
</style></head><body><div class="wrap">
<div id="home" class="hero"><img src="january-menu.png" alt="Январь — Мороз Иванович"><a class="hotspot read" href="#read" data-open="read">Читать</a><a class="hotspot listen" href="#listen" data-open="listen">Слушать</a><a class="hotspot watch" href="#watch" data-open="watch">Смотреть</a><a class="hotspot play" href="#play" data-open="play">Играть</a></div>
<section id="read" class="section"><div class="topbar"><button data-home>⌂ На главную</button><b>📖 Читать</b></div><div class="book-head"><div class="month">❄ ЯНВАРЬ ❄</div><h1>Мороз Иванович</h1><p>В. Ф. Одоевский</p></div><div class="book"><div class="badge" id="badge"></div><h2 class="ptitle" id="ptitle"></h2><div class="scene" id="scene"></div><div class="booktext" id="booktext"></div><div class="moral" id="moral"></div><div class="counter" id="counter"></div></div><div class="nav"><button id="prev">← Предыдущая</button><button id="next">Следующая →</button></div><button class="contentsBtn" id="contentsBtn">☰ Содержание</button><div class="contents" id="contents"></div></section>
<section id="listen" class="section"><div class="topbar"><button data-home>← На главную</button><b>🎧 Слушать</b></div><div class="card"><h2>Аудиосказка</h2><a class="bigbtn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=_AVEZ_u6qdk">▶ Открыть аудиосказку</a></div></section>
<section id="watch" class="section"><div class="topbar"><button data-home>← На главную</button><b>🎬 Смотреть</b></div><div class="card"><h2>Мультфильм</h2><a class="bigbtn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=FtNibT1qPSI">▶ Смотреть мультфильм</a></div></section>
<section id="play" class="section"><div class="topbar"><button data-home>← На главную</button><b>🎮 Играть</b></div><div class="card quiz"><h2>Кто был трудолюбивым?</h2><button data-answer="correct">Рукодельница</button><button data-answer="wrong">Ленивица</button><div class="status"></div></div><div class="card quiz"><h2>Что уронила Рукодельница?</h2><button data-answer="wrong">Клубок</button><button data-answer="correct">Ведёрко</button><button data-answer="wrong">Книгу</button><div class="status"></div></div></section>
</div>
<script>
const pages=[
["Две девочки",["В одном доме жили две девочки: Рукодельница и Ленивица.","Рукодельница была трудолюбивая: рано вставала, помогала по дому и всё делала старательно.","Ленивица любила лежать и ждать, пока за неё всё сделают другие."],"Труд всегда вознаграждается!"],
["Колодец",["Однажды Рукодельница пошла за водой и уронила ведёрко в колодец.","Чтобы вернуть его, девочке пришлось отправиться в необычное путешествие. Она не испугалась и смело отправилась в путь."],"Смелость помогает преодолевать трудности."],
["В зимнем лесу",["Путь привёл Рукодельницу в удивительный зимний мир.","Девочка внимательно относилась ко всему, что встречала на пути, была вежливой, доброй и готовой помочь."],"Доброе сердце замечает, кому нужна помощь."],
["Мороз Иванович",["Наконец Рукодельница встретила Мороза Ивановича.","Он оказался строгим, но справедливым хозяином. Девочка не испугалась работы и старательно выполняла поручения."],"Старательность и вежливость украшают человека."],
["Работа и награда",["Рукодельница помогала Морозу Ивановичу и всё делала аккуратно и с добрым сердцем.","За труд, терпение и хорошее отношение Мороз Иванович щедро наградил девочку."],"Настоящая награда приходит за честный труд."],
["Ленивица у Мороза",["Узнав о награде, Ленивица тоже захотела получить подарки.","Но трудиться ей не хотелось: она была невежливой, выполняла всё небрежно и думала только о награде."],"Одного желания получить награду недостаточно."],
["Возвращение домой",["Девочки вернулись домой, но результаты их путешествия оказались разными.","Рукодельница получила заслуженную награду, а Ленивица поняла, что лень и грубость не приносят добра."],"Каждый поступок имеет свои последствия."],
["Главная мысль",["Сказка напоминает нам о трудолюбии, доброте, вежливости и ответственности.","Важно не ждать, что всё сделают другие, а стараться, помогать и с уважением относиться к людям."],"❄ Добро и труд всегда вознаграждаются! ❄"]];
let page=0,home=document.getElementById("home"),sections=[...document.querySelectorAll(".section")],contents=document.getElementById("contents");
function render(){let p=pages[page];badge.textContent="Глава "+(page+1);ptitle.textContent=p[0];booktext.innerHTML=p[1].map(x=>"<p>"+x+"</p>").join("");moral.textContent=p[2];counter.textContent=(page+1)+" / 8";scene.style.backgroundPosition="center "+(page/7*100)+"%";prev.disabled=page===0;next.disabled=page===7;next.textContent=page===7?"Книга прочитана ✓":"Следующая →";[...contents.children].forEach((b,i)=>b.classList.toggle("current",i===page))}
pages.forEach((p,i)=>{let b=document.createElement("button");b.textContent=(i+1)+". "+p[0];b.onclick=()=>{page=i;render();contents.classList.remove("open");scrollTo({top:0,behavior:"smooth"})};contents.appendChild(b)});
prev.onclick=()=>{if(page){page--;render();scrollTo({top:0,behavior:"smooth"})}};next.onclick=()=>{if(page<7){page++;render();scrollTo({top:0,behavior:"smooth"})}};contentsBtn.onclick=()=>contents.classList.toggle("open");
function openSection(id){home.style.display="none";sections.forEach(s=>s.classList.toggle("active",s.id===id));if(id==="read")render();scrollTo({top:0,behavior:"smooth"})}function goHome(){sections.forEach(s=>s.classList.remove("active"));home.style.display="block";scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();openSection(a.dataset.open)});document.querySelectorAll("[data-home]").forEach(b=>b.onclick=goHome);document.querySelectorAll("[data-answer]").forEach(btn=>btn.onclick=()=>{let q=btn.closest(".quiz");q.querySelectorAll("[data-answer]").forEach(b=>b.classList.remove("correct","wrong"));let ok=btn.dataset.answer==="correct";btn.classList.add(ok?"correct":"wrong");q.querySelector(".status").textContent=ok?"✅ Верно! Молодец!":"❄️ Попробуй ещё раз."});render();
</script></body></html>
